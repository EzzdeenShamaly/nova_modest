org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin compile daemon runs as a separate JVM; cap it so it can start alongside
# the Gradle daemon on a 16GB machine.
kotlin.daemon.jvmargs=-Xmx2G

# The Kotlin compile daemon starts healthy but the Gradle client cannot reach it
# over loopback RMI on this machine. Compiling in-process avoids the second
# process entirely. See the daemon logs: "listening on port N" then "Unused
# timeout exceeded 60s" - it is never contacted.
kotlin.compiler.execution.strategy=in-process

# The pub cache lives on C: while this project lives on E:. Kotlin's incremental
# compiler stores source paths relative to the project root, and File.relativeTo
# cannot express a path across two Windows drive letters - it throws
# "this and base files have different roots", which surfaces as the misleading
# "Could not close incremental caches in ...\shared_preferences_android\...".
# Disabling incremental compilation skips that path conversion entirely. The
# Kotlin here is only plugin glue plus MainActivity, so a full recompile is
# cheap. Root-cause alternative: put PUB_CACHE on the same drive as the project.
kotlin.incremental=false
