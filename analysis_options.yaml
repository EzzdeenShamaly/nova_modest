include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Missing a localization key must break the build, not fall back to the
    # template locale at runtime (11-flutter-l10n-guard.md §5).
    missing_required_param: error
    missing_return: error
  exclude:
    # Generated output is committed but not linted — its style is the
    # generator's business, and lint noise there hides real findings.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - require_trailing_commas
    - avoid_print
    - always_declare_return_types
    - unawaited_futures
    - use_super_parameters
