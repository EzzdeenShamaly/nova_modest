name: nova_modest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — locked to Bloc by /platform-init
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Routing
  go_router: ^17.5.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking — REST only
  dio: ^5.11.0

  # Secure storage for auth tokens
  flutter_secure_storage: ^11.0.0

  # Non-sensitive local flags (onboarding-seen). Deliberately NOT secure storage:
  # 03-flutter-security-guard names this exact case as a SharedPreferences one,
  # and a keystore entry can be lost on a backup restore, which would replay the
  # onboarding to an existing user.
  shared_preferences: ^2.5.5

  # Localization
  intl: ^0.20.2   # pinned to 0.20.2 by flutter_localizations from the SDK

  # Responsive scaling — design baseline 375x812
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.15.1   # capped: freezed 3.2.5 requires analyzer <11, build_runner >=2.15.2 requires >=13.3
  freezed: ^3.2.6-dev.1   # prerelease required: injectable_generator 3.1.3 needs analyzer ^12, stable freezed 3.2.5 caps it at <11
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Google's brand mark, exported from the design at 1x/2x/3x. A PNG rather
    # than an SVG so no rendering package is needed, and rather than hand-drawn
    # paths so the four brand colours never appear as literals in Dart
    # (12-flutter-design-system-guard.md).
    - assets/images/auth/

  # IBM Plex Sans Arabic is bundled rather than fetched through google_fonts:
  # this app's primary locale is Arabic, and a runtime font download would show
  # a fallback face on first launch and fail entirely offline.
  # Licensed under the SIL Open Font License — see assets/fonts/OFL.txt.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
